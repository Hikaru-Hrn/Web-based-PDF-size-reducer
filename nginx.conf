server {
    listen 80;
    server_name localhost;

    client_max_body_size 300M; # Лимит на загрузку файла

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/ {
        alias /app/static/; # Раздача статики напрямую
    }

}
