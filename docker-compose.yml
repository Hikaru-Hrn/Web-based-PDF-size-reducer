services:
  web:
    build:
      context: .
      network: host
    network_mode: host
    # Здесь должен быть запуск FastAPI
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - redis

  worker:
    build:
      context: .
      network: host
    network_mode: host
    # Здесь должен быть запуск Celery
    command: celery -A app.worker.celery_app worker --loglevel=info
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    network_mode: host

  nginx:
    image: nginx:latest
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./static:/app/static
    depends_on:
      - web
