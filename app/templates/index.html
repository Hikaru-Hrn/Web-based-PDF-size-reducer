<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PDF Optimizer PRO</title>
        <link rel="stylesheet" href="/static/style.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div class="glass-container">
            <header>
                <h1>PDF Optimizer</h1>
                <p class="subtitle">
                    Уменьшите размер файла без потери качества
                </p>
            </header>

            <main>
                <div class="settings-group">
                    <label for="quality">Степень сжатия:</label>
                    <select id="quality" class="custom-select">
                        <option value="low">
                            Максимальное (для Email, 72 dpi)
                        </option>
                        <option value="medium" selected>
                            Сбалансированное (Эл. книги, 150 dpi)
                        </option>
                        <option value="high">
                            Минимальное (Печать, 300 dpi)
                        </option>
                    </select>
                </div>

                <div class="drop-zone" id="drop-zone">
                    <div class="upload-icon">📄</div>
                    <input type="file" id="file-input" hidden accept=".pdf" />
                    <p id="file-name">
                        Перетащите PDF сюда или кликните для выбора
                    </p>
                    <p class="file-limit">Максимальный размер: 300MB</p>
                </div>

                <button onclick="startCompression()" class="main-btn">
                    <span class="btn-text">Оптимизировать</span>
                </button>

                <div id="status-area" class="status-area">
                    <!-- Сюда JS будет вставлять статус и кнопку скачивания -->
                </div>
            </main>
        </div>
        <script src="/static/script.js"></script>
    </body>
</html>
